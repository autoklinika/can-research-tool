name: Live Preview Capacity

on:
  push:
  pull_request:

jobs:
  preview-capacity-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GUI
        run: python -m pip install -q -e ".[gui]"
      - name: Verify bounded Live preview without extra GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/live_preview_capacity_smoke.py
      - name: Verify Live filtering during active Capture
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/live_filter_display_binding_smoke.py
