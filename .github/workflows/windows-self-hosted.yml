name: Windows Self-Hosted CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-self-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Environment
        shell: pwsh
        run: |
          python --version
          python -c "import platform; print(platform.platform())"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,kvaser,gui]"

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app kvaser gui

      - name: Unit tests
        shell: pwsh
        run: python -m pytest -q

      - name: GUI startup and shell smoke tests
        shell: pwsh
        run: |
          python .\tests_gui\application_startup_smoke.py
          python .\tests_gui\engineering_shell_smoke.py

      - name: Core GUI regression smoke tests
        shell: pwsh
        run: |
          python .\tests_gui\static_filter_editor_smoke.py
          python .\tests_gui\filter_manager_window_smoke.py
          python .\tests_gui\static_filter_live_stored_smoke.py
          python .\tests_gui\live_filter_worker_smoke.py
          python .\tests_gui\live_buffer_performance_smoke.py
          python .\tests_gui\dbc_activation_smoke.py
          python .\tests_gui\session_management_smoke.py tree
          python .\tests_gui\session_management_smoke.py live
          python .\tests_gui\session_management_smoke.py imported
          python .\tests_gui\table_hover_smoke.py
          python .\tests_gui\protocol_filter_gui_smoke.py
