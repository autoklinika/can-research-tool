name: Windows Self-Hosted CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-self-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QT_QPA_PLATFORM: offscreen
      CRT_CI_PYTHON: "C:\CAN\can-research-tool\.venv\Scripts\python.exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runner environment
        shell: pwsh
        run: |
          if (-not (Test-Path $env:CRT_CI_PYTHON)) {
              throw "CRT Python not found: $env:CRT_CI_PYTHON"
          }
          & $env:CRT_CI_PYTHON --version
          & $env:CRT_CI_PYTHON -c "import platform; print(platform.platform())"
          & $env:CRT_CI_PYTHON -c "import PySide6, pytest, canlib, cantools; print('Dependencies: OK')"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Python: $env:CRT_CI_PYTHON"

      - name: Compile Python sources
        shell: pwsh
        run: '& $env:CRT_CI_PYTHON -m compileall -q app kvaser gui'

      - name: Unit tests
        shell: pwsh
        run: '& $env:CRT_CI_PYTHON -m pytest -q'

      - name: GUI startup and shell smoke tests
        shell: pwsh
        run: |
          & $env:CRT_CI_PYTHON .\tests_gui\application_startup_smoke.py
          & $env:CRT_CI_PYTHON .\tests_gui\engineering_shell_smoke.py

      - name: Core GUI regression smoke tests
        shell: pwsh
        run: |
          & $env:CRT_CI_PYTHON .\tests_gui\static_filter_editor_smoke.py
          & $env:CRT_CI_PYTHON .\tests_gui\filter_manager_window_smoke.py
          & $env:CRT_CI_PYTHON .\tests_gui\static_filter_live_stored_smoke.py
          & $env:CRT_CI_PYTHON .\tests_gui\live_filter_worker_smoke.py
          & $env:CRT_CI_PYTHON .\tests_gui\live_buffer_performance_smoke.py
          & $env:CRT_CI_PYTHON .\tests_gui\dbc_activation_smoke.py
          & $env:CRT_CI_PYTHON .\tests_gui\session_management_smoke.py tree
          & $env:CRT_CI_PYTHON .\tests_gui\session_management_smoke.py live
          & $env:CRT_CI_PYTHON .\tests_gui\session_management_smoke.py imported
          & $env:CRT_CI_PYTHON .\tests_gui\table_hover_smoke.py
          & $env:CRT_CI_PYTHON .\tests_gui\protocol_filter_gui_smoke.py
