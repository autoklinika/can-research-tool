name: Windows Self-Hosted CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-self-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QT_QPA_PLATFORM: offscreen
      CRT_CI_BOOTSTRAP_PYTHON: 'C:\Program Files\Python312\python.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare isolated Python environment
        run: |
          if (-not (Test-Path $env:CRT_CI_BOOTSTRAP_PYTHON)) {
              throw "Machine Python not found: $env:CRT_CI_BOOTSTRAP_PYTHON"
          }

          $venvPath = Join-Path $env:RUNNER_TEMP 'crt-ci-venv'
          if (Test-Path $venvPath) {
              Remove-Item -Recurse -Force $venvPath
          }

          & $env:CRT_CI_BOOTSTRAP_PYTHON --version
          & $env:CRT_CI_BOOTSTRAP_PYTHON -m venv $venvPath

          $ciPython = Join-Path $venvPath 'Scripts\python.exe'
          if (-not (Test-Path $ciPython)) {
              throw "CI Python was not created: $ciPython"
          }

          "CRT_CI_PYTHON=$ciPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $ciPython -m pip install --upgrade pip
          & $ciPython -m pip install -e ".[dev,kvaser,gui]"
          & $ciPython -c "import PySide6, pytest, canlib, cantools; print('Dependencies: OK')"

          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "CI Python: $ciPython"

      - name: Compile Python sources
        run: '& $env:CRT_CI_PYTHON -m compileall -q app kvaser gui'

      - name: Unit tests
        run: '& $env:CRT_CI_PYTHON -m pytest -q'

      - name: Application startup smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\application_startup_smoke.py'

      - name: Engineering shell smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\engineering_shell_smoke.py'

      - name: Static filter editor smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\static_filter_editor_smoke.py'

      - name: Filter manager window smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\filter_manager_window_smoke.py'

      - name: Static filter Live and stored smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\static_filter_live_stored_smoke.py'

      - name: Live filter worker smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\live_filter_worker_smoke.py'

      - name: Live buffer performance smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\live_buffer_performance_smoke.py'

      - name: DBC activation smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\dbc_activation_smoke.py'

      - name: Session tree smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\session_management_smoke.py tree'

      - name: Live session actions smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\session_management_smoke.py live'

      - name: Imported session actions smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\session_management_smoke.py imported'

      - name: Table hover smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\table_hover_smoke.py'

      - name: Protocol filter GUI smoke
        run: '& $env:CRT_CI_PYTHON .\tests_gui\protocol_filter_gui_smoke.py'
