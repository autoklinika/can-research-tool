name: Export Current Filter Source

on:
  push:
    branches:
      - agent/live-buffer-performance-fix

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: current-filter-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
# trigger
