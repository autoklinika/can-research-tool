name: Signal Hypothesis AI Stage 1 Validation

on:
  pull_request:
    paths:
      - "app/local_ai.py"
      - "app/signal_hypothesis_service.py"
      - "app/signal_hypothesis_guardrail.py"
      - "app/help_catalog_signal_hypothesis.py"
      - "app/comparison_analysis_service.py"
      - "app/extensions/contracts.py"
      - "app/extensions/builtin/signal_hypothesis_ai.py"
      - "gui/signal_hypothesis_view.py"
      - "gui/comparison_visualization_stage2d1.py"
      - "tests/test_local_ai_request_contract.py"
      - "tests/test_signal_hypothesis_ai.py"
      - "tests/test_signal_hypothesis_ai_response_contract.py"
      - "tests/test_signal_hypothesis_operator_context_guardrail.py"
      - "tests_gui/signal_hypothesis_smoke.py"
      - "tests_gui/help_center_smoke.py"
      - ".github/workflows/signal-hypothesis-ai-stage1.yml"
  workflow_dispatch:

jobs:
  signal-hypothesis-ai:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GUI and test tooling
        run: python -m pip install -q -e ".[gui,dev]"

      - name: Compile Signal Hypothesis sources
        run: >-
          python -m compileall -q
          app/local_ai.py
          app/signal_hypothesis_service.py
          app/signal_hypothesis_guardrail.py
          app/help_catalog_signal_hypothesis.py
          app/comparison_analysis_service.py
          app/extensions/contracts.py
          app/extensions/builtin/signal_hypothesis_ai.py
          gui/signal_hypothesis_view.py
          gui/comparison_visualization_stage2d1.py
          tests/test_local_ai_request_contract.py
          tests/test_signal_hypothesis_ai.py
          tests/test_signal_hypothesis_ai_response_contract.py
          tests/test_signal_hypothesis_operator_context_guardrail.py
          tests_gui/signal_hypothesis_smoke.py
          tests_gui/help_center_smoke.py

      - name: Verify local AI guardrails and Signal Hypothesis core
        run: >-
          python -m pytest
          tests/test_local_ai_request_contract.py
          tests/test_signal_hypothesis_ai.py
          tests/test_signal_hypothesis_ai_response_contract.py
          tests/test_signal_hypothesis_operator_context_guardrail.py
          tests/test_extension_api_foundation.py
          tests/test_signal_candidate_engine.py
          -q --junitxml=signal-hypothesis-ai-junit.xml

      - name: Verify Signal Hypothesis production GUI without network
        run: python tests_gui/signal_hypothesis_smoke.py

      - name: Verify Signal Hypothesis Help Center
        run: python tests_gui/help_center_smoke.py

      - name: Upload Signal Hypothesis diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signal-hypothesis-ai-windows
          path: signal-hypothesis-ai-junit.xml
          if-no-files-found: warn
          retention-days: 3
