name: Experiment Diff Marker Correlation Stage 1 Validation

on:
  push:
  pull_request:

jobs:
  experiment-diff-marker-correlation:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GUI and test tooling
        run: python -m pip install -q -e ".[gui,dev]"
      - name: Compile Experiment Diff sources
        run: >-
          python -m compileall -q
          app/extensions/builtin/experiment_marker_correlation.py
          app/experiment_diff_service.py
          gui/experiment_diff_view.py
          gui/comparison_visualization_stage2d1.py
          tests/test_experiment_marker_correlation.py
          tests_gui/experiment_diff_smoke.py
      - name: Verify Experiment Diff core
        run: >-
          python -m pytest
          tests/test_experiment_marker_correlation.py
          -q --junitxml=experiment-diff-junit.xml
      - name: Verify Experiment Diff production GUI
        run: python tests_gui/experiment_diff_smoke.py
      - name: Upload core diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-diff-marker-correlation-windows
          path: experiment-diff-junit.xml
          retention-days: 3
