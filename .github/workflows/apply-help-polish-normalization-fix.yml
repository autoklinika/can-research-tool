name: Apply Help Polish normalization fix

on:
  push:
    branches:
      - agent/help-center-stage1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Help branch
        uses: actions/checkout@v4
        with:
          ref: agent/help-center-stage1
          fetch-depth: 0
      - name: Normalize Polish letters not decomposed by NFKD
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/help_catalog.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _normalize(value: str) -> str:
              decomposed = unicodedata.normalize("NFKD", str(value).casefold())
              without_marks = "".join(char for char in decomposed if not unicodedata.combining(char))
              return " ".join(re.findall(r"[a-z0-9x]+", without_marks))
          '''
          new = '''def _normalize(value: str) -> str:
              folded = str(value).casefold().translate(str.maketrans({"ł": "l"}))
              decomposed = unicodedata.normalize("NFKD", folded)
              without_marks = "".join(
                  char for char in decomposed if not unicodedata.combining(char)
              )
              return " ".join(re.findall(r"[a-z0-9x]+", without_marks))
          '''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("expected _normalize implementation not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit focused normalization fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/help_catalog.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix accent-insensitive Help search for Polish letters"
          git push origin HEAD:agent/help-center-stage1
