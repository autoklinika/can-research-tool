name: GUI Regressions

on:
  push:
  pull_request:

jobs:
  filter-regressions:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GUI and test tooling
        run: python -m pip install -q -e ".[gui,dev]"
      - name: Compile Python sources
        run: python -m compileall -q app gui tests tests_gui
      - name: Verify search and SQLite core
        run: >-
          python -m pytest
          tests/test_search_engine.py
          tests/test_project_search_index.py
          tests/test_project_catalog.py
          tests/test_comparison_sets.py
          tests/test_comparison_statistics_provider.py
          tests/test_payload_difference_provider.py
          tests/test_payload_difference_exact_storage.py
          tests/test_message_sequence_provider.py
          tests/test_comparison_evidence.py
          tests/test_sqlite_architecture.py
          tests/test_session_filters.py
          tests/test_stored_search_navigation.py
          -q
      - name: Verify Windows GUI regressions
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $commands = @(
            "python tests_gui/engineering_shell_smoke.py",
            "python tests_gui/project_properties_smoke.py",
            "python tests_gui/project_catalog_smoke.py",
            "python tests_gui/comparison_sets_smoke.py",
            "python tests_gui/comparison_statistics_smoke.py",
            "python tests_gui/payload_difference_smoke.py",
            "python tests_gui/message_sequence_comparison_smoke.py",
            "python tests_gui/comparison_visualization_smoke.py",
            "python tests_gui/comparison_visualization_navigation_smoke.py",
            "python tests_gui/project_preparation_progress_smoke.py",
            "python tests_gui/persistent_search_index_smoke.py",
            "python tests_gui/stored_search_navigation_smoke.py",
            "python tests_gui/logical_search_cache_smoke.py",
            "python tests_gui/project_overview_session_details_smoke.py",
            "python tests_gui/deferred_live_logical_smoke.py",
            "python tests_gui/deferred_log_save_smoke.py",
            "python tests_gui/live_unsaved_second_start_smoke.py",
            "python tests_gui/live_temp_cleanup_smoke.py",
            "python tests_gui/dbc_activation_smoke.py",
            "python tests_gui/session_management_smoke.py tree",
            "python tests_gui/stored_logical_workspace_smoke.py",
            "python tests_gui/session_analysis_workflow_smoke.py",
            "python tests_gui/session_statistics_table_smoke.py",
            "python tests_gui/session_statistics_visual_summary_smoke.py",
            "python tests_gui/session_artifact_selector_smoke.py",
            "python tests_gui/minimal_analysis_chrome_smoke.py",
            "python tests_gui/logical_message_details_smoke.py",
            "python tests_gui/uds_data_display_smoke.py",
            "python tests_gui/session_management_smoke.py live",
            "python tests_gui/session_management_smoke.py imported",
            "python tests_gui/stored_session_filter_optin_smoke.py",
            "python tests_gui/filter_manager_window_smoke.py",
            "python tests_gui/static_filter_editor_smoke.py",
            "python tests_gui/static_filter_live_stored_smoke.py",
            "python tests_gui/live_filter_worker_smoke.py",
            "python tests_gui/live_buffer_performance_smoke.py",
            "python tests_gui/raw_frame_grouping_smoke.py",
            "python tests_gui/table_hover_smoke.py",
            "python tests_gui/protocol_filter_gui_smoke.py"
          )
          Remove-Item gui-regressions-windows.log -ErrorAction SilentlyContinue
          foreach ($command in $commands) {
            "`n===== $command =====" | Tee-Object -FilePath gui-regressions-windows.log -Append | Write-Host
            $output = & cmd.exe /d /c "$command 2>&1"
            $result = $LASTEXITCODE
            $output | Tee-Object -FilePath gui-regressions-windows.log -Append | Write-Host
            if ($result -ne 0) { exit $result }
          }
      - name: Upload Windows GUI regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-regressions-windows
          path: gui-regressions-windows.log
          if-no-files-found: ignore
          retention-days: 3
