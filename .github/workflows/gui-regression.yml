name: GUI Regressions

on:
  push:
  pull_request:

jobs:
  filter-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1
      - name: Install GUI
        run: python -m pip install -q -e ".[gui]"
      - name: Verify engineering IDE shell
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/engineering_shell_smoke.py
      - name: Verify DBC activation controls
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/dbc_activation_smoke.py
      - name: Verify CAN session tree integration
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/session_management_smoke.py tree
      - name: Verify stored logical target workspace
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/stored_logical_workspace_smoke.py
      - name: Verify Live session actions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/session_management_smoke.py live
      - name: Verify imported session actions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/session_management_smoke.py imported
      - name: Verify stored-session filters are explicit opt-in
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/stored_session_filter_optin_smoke.py
      - name: Verify global filters use a separate non-modal window
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/filter_manager_window_smoke.py
      - name: Verify static filter fields and operators in editor
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/static_filter_editor_smoke.py
      - name: Verify static filters in Live and stored sessions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/static_filter_live_stored_smoke.py
      - name: Verify Live filters use the background worker
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/live_filter_worker_smoke.py
      - name: Verify bounded Live models avoid per-refresh full-buffer work
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/live_buffer_performance_smoke.py
      - name: Verify fast pastel table cell hover
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/table_hover_smoke.py
      - name: Verify protocol filters in GUI and logical Live view
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/protocol_filter_gui_smoke.py
