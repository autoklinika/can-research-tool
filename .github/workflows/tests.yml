name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -q -e ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q app kvaser gui
      - name: Run tests
        run: |
          set +e
          pytest -q > pytest-output.txt 2>&1
          result=$?
          cat pytest-output.txt
          exit $result
      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          retention-days: 3

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1
      - name: Install GUI
        run: python -m pip install -q -e ".[gui]"
      - name: Create project workspace offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch

          from PySide6.QtCore import Qt
          from PySide6.QtWidgets import QApplication, QDialog

          from app.markers import MarkerPreset
          from app.project_dbc import import_project_dbc
          from gui.filter_integration import install_filter_integration
          from gui.live_filter_integration import install_live_filter_integration
          from gui.live_save_integration import install_live_save_integration
          from gui.main_window import MainWindow
          from gui.marker_manager import MarkerManagerDialog
          from gui.session_filter_integration import install_session_filter_integration


          DBC_TEXT = '''VERSION ""

          NS_ :
              NS_DESC_
              CM_
              BA_DEF_
              BA_
              VAL_
              CAT_DEF_
              CAT_
              FILTER
              BA_DEF_DEF_
              EV_DATA_
              ENVVAR_DATA_
              SGTYPE_
              SGTYPE_VAL_
              BA_DEF_SGTYPE_
              BA_SGTYPE_
              SIG_TYPE_REF_
              VAL_TABLE_
              SIG_GROUP_
              SIG_VALTYPE_
              SIGTYPE_VALTYPE_
              BO_TX_BU_
              BA_DEF_REL_
              BA_REL_
              BA_DEF_DEF_REL_
              BU_SG_REL_
              BU_EV_REL_
              BU_BO_REL_
              SG_MUL_VAL_

          BS_:

          BU_: ECU

          BO_ 291 EGR_Status: 8 ECU
           SG_ EGR_Position : 0|8@1+ (0.4,0) [0|100] "%" Vector__XXX
          '''


          class AcceptedProjectDialog:
              def __init__(self, parent=None) -> None:
                  self.parent = parent

              def exec(self):
                  return QDialog.DialogCode.Accepted

              def project_root(self) -> Path:
                  return PROJECT_ROOT

              def project_name(self) -> str:
                  return "Smoke"

              def description(self) -> str:
                  return "GUI project creation smoke test"

              def bitrate(self) -> int:
                  return 250_000

              def receive_mode(self) -> str:
                  return "bench"


          install_filter_integration()
          install_live_filter_integration()
          install_live_save_integration()
          install_session_filter_integration()

          app = QApplication([])
          with TemporaryDirectory() as temporary:
              PROJECT_ROOT = Path(temporary) / "project"
              window = MainWindow()
              with patch("gui.main_window.NewProjectDialog", AcceptedProjectDialog):
                  window._new_project()

              assert window.project is not None
              assert window.project.root == PROJECT_ROOT.resolve()
              assert (PROJECT_ROOT / "project.crt.json").is_file()
              assert (PROJECT_ROOT / ".crt" / "project.sqlite").is_file()
              assert hasattr(window, "filters_action")

              window.project.add_study_area("EGR")
              window.project.save_marker_presets(
                  [MarkerPreset.create("EGR odłączony", "F3", area="EGR")]
              )
              window.explorer.refresh()
              window._open_live_capture()
              live = window._tab_keys["live-capture"]
              live._update_marker_tile()
              assert "1 aktywnych / 1" in live.marker_setup_button.text()
              assert live.message_table.model() is live.message_model
              assert live.frame_table.model() is live.live_filter_proxy
              assert live.save_session_button.isChecked() is False
              assert "Zapisz sesję" in live.save_session_button.text()
              assert live.session_name.isEnabled() is False

              live.save_session_button.click()
              assert live.save_session_button.isChecked() is True
              assert "UZBROJONY" in live.save_session_button.text()
              assert live.session_name.isEnabled() is True

              marker_dialog = MarkerManagerDialog(window.project)
              assert marker_dialog.model.rowCount() == 1
              marker_dialog.close()

              dbc_source = Path(temporary) / "egr.dbc"
              dbc_source.write_text(DBC_TEXT, encoding="utf-8")
              import_project_dbc(window.project, dbc_source)
              window._open_decoders()
              decoders = window._tab_keys["decoders"]
              decoders.model.refresh()
              assert decoders.model.rowCount() == 1
              assert decoders.model.active_count == 1
              assert decoders.model.setData(
                  decoders.model.index(0, 0),
                  Qt.Unchecked,
                  Qt.CheckStateRole,
              )
              assert decoders.model.active_count == 0
              assert decoders.model.setData(
                  decoders.model.index(0, 0),
                  Qt.Checked,
                  Qt.CheckStateRole,
              )
              assert decoders.model.active_count == 1

              assert window.tabs.count() >= 3
              assert window.explorer.tree.model().rowCount() == 1
              window.close()
          app.quit()
          PY
