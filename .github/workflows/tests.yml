name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -q -e ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q app kvaser gui
      - name: Run tests
        run: pytest -q

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1
      - name: Install GUI
        run: python -m pip install -q -e ".[gui]"
      - name: Create project workspace offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from PySide6.QtWidgets import QApplication

          from app.project import CrtProject
          from gui.main_window import MainWindow

          app = QApplication([])
          with TemporaryDirectory() as temporary:
              project = CrtProject.create(Path(temporary) / "project", name="Smoke")
              project.add_study_area("EGR")
              window = MainWindow()
              window._set_project(project)
              window._open_live_capture()
              assert window.project is project
              assert window.tabs.count() >= 2
              assert window.explorer.tree.model().rowCount() == 1
              window.close()
          app.quit()
          PY
