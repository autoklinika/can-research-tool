name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -q -e ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q app kvaser gui
      - name: Run tests
        run: pytest -q

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1
      - name: Install GUI
        run: python -m pip install -q -e ".[gui]"
      - name: Create project workspace offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch

          from PySide6.QtWidgets import QApplication, QDialog

          from app.markers import MarkerPreset
          from gui.main_window import MainWindow


          class AcceptedProjectDialog:
              def __init__(self, parent=None) -> None:
                  self.parent = parent

              def exec(self):
                  return QDialog.DialogCode.Accepted

              def project_root(self) -> Path:
                  return PROJECT_ROOT

              def project_name(self) -> str:
                  return "Smoke"

              def description(self) -> str:
                  return "GUI project creation smoke test"

              def bitrate(self) -> int:
                  return 250_000

              def receive_mode(self) -> str:
                  return "bench"


          class AcceptedMarkerDialog:
              def __init__(self, *, existing=None, areas=None, parent=None) -> None:
                  self.existing = existing
                  self.areas = list(areas or [])
                  self.parent = parent

              def exec(self):
                  return QDialog.DialogCode.Accepted

              def preset(self, sort_order: int) -> MarkerPreset:
                  return MarkerPreset.create(
                      "EGR odłączony",
                      "F3",
                      area="EGR",
                      sort_order=sort_order,
                  )


          app = QApplication([])
          with TemporaryDirectory() as temporary:
              PROJECT_ROOT = Path(temporary) / "project"
              window = MainWindow()
              with patch("gui.main_window.NewProjectDialog", AcceptedProjectDialog):
                  window._new_project()

              assert window.project is not None
              assert window.project.root == PROJECT_ROOT.resolve()
              assert (PROJECT_ROOT / "project.crt.json").is_file()
              assert (PROJECT_ROOT / ".crt" / "project.sqlite").is_file()

              window.project.add_study_area("EGR")
              window.explorer.refresh()
              window._open_live_capture()
              live = window._tab_keys["live-capture"]
              before = live.marker_model.rowCount()
              with patch("gui.live_capture.MarkerPresetDialog", AcceptedMarkerDialog):
                  live._add_marker_preset()
              assert live.marker_model.rowCount() == before + 1
              assert window.project.list_marker_presets()[0].name == "EGR odłączony"
              assert window.project.list_marker_presets()[0].shortcut == "F3"

              assert window.tabs.count() >= 2
              assert window.explorer.tree.model().rowCount() == 1
              window.close()
          app.quit()
          PY
