name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -q -e ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q app kvaser gui
      - name: Run tests
        run: pytest -q

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GUI
        run: python -m pip install -q -e ".[gui]"
      - name: Create main window offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python - <<'PY' > gui-smoke.log 2>&1
          from PySide6.QtWidgets import QApplication
          from gui.main_window import MainWindow

          app = QApplication([])
          window = MainWindow()
          assert window.windowTitle() == "CAN Research Tool"
          window.close()
          app.quit()
          PY
          echo "$?" > gui-smoke.status
          cat gui-smoke.log
          exit 0
      - name: Upload GUI smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-diagnostics
          path: |
            gui-smoke.log
            gui-smoke.status
      - name: Verify GUI smoke result
        run: test "$(cat gui-smoke.status)" = "0"
