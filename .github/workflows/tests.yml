name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -q -e ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q app kvaser gui
      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q *> pytest-output.txt
          $result = $LASTEXITCODE
          Get-Content pytest-output.txt
          exit $result
      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-windows
          path: pytest-output.txt
          retention-days: 3

  gui-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GUI and test tooling
        run: python -m pip install -q -e ".[gui,dev]"
      - name: Verify production shell and Help Center
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python tests_gui/engineering_shell_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests_gui/help_center_smoke.py
          exit $LASTEXITCODE
