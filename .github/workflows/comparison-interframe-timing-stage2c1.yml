name: Comparison Inter-Frame Timing Stage 2C1 Validation

on:
  push:
  pull_request:

jobs:
  comparison-interframe-timing-stage2c1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1
      - name: Install GUI and test tooling
        run: python -m pip install -q -e ".[gui,dev]"
      - name: Compile Stage 2C1 sources
        run: >-
          python -m compileall -q
          app/comparison_interframe_timing.py
          gui/comparison_interframe_timing_view.py
          gui/comparison_visualization_stage2c1.py
          gui/comparison_sets_analysis_view.py
          tests/test_comparison_interframe_timing.py
          tests_gui/comparison_interframe_timing_smoke.py
      - name: Verify inter-frame timing core and artifact
        run: python -m pytest tests/test_comparison_interframe_timing.py -q
      - name: Verify inter-frame timing GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/comparison_interframe_timing_smoke.py
