name: Comparison UDS Timeline Stage 2D2 Validation

on:
  push:
  pull_request:

jobs:
  uds-timeline-stage2d2:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GUI and test tooling
        run: python -m pip install -q -e ".[gui,dev]"
      - name: Compile Stage 2D2 sources
        run: python -m compileall -q app/comparison_uds_timeline.py app/help_catalog_registry.py app/help_catalog_stage2d2.py gui/comparison_uds_timeline_view.py gui/comparison_visualization_stage2d2.py gui/help_center_view_stage2d2.py tests/test_comparison_uds_timeline.py tests_gui/comparison_uds_timeline_smoke.py
      - name: Verify UDS timeline core and Help coverage
        run: python -m pytest tests/test_comparison_uds_timeline.py tests/test_help_catalog.py -q --junitxml=stage2d2-junit.xml
      - name: Upload Stage 2D2 core diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage2d2-core-windows
          path: stage2d2-junit.xml
          retention-days: 3
      - name: Verify production synchronized UDS timeline GUI
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python tests_gui/comparison_uds_timeline_smoke.py *> stage2d2-gui.log
          $result = $LASTEXITCODE
          Get-Content stage2d2-gui.log
          exit $result
      - name: Upload Stage 2D2 GUI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage2d2-gui-windows
          path: stage2d2-gui.log
          retention-days: 3
      - name: Verify production Help Center GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/help_center_smoke.py
