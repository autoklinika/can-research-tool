name: Apply Live Stream Filter Mechanism

on:
  push:
    branches:
      - agent/live-buffer-performance-fix

permissions:
  contents: write

jobs:
  apply-stream-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-buffer-performance-fix
          fetch-depth: 0
      - name: Apply streaming presentation changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "gui/live_filter_integration.py"

          replace_once(
              path,
              "INCREMENTAL_FILTER_DELAY_MS = 10\n\n\nclass LiveFilterScanSignals",
