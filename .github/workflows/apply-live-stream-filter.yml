              "    def begin_streaming_view(self) -> None:\n        \"\"\"Start with an empty presentation and accept only future frames.\"\"\"\n\n        if not self.filter_enabled:\n            return\n        self.beginResetModel()\n        self.filter_scanning = False\n        self.filter_ready = True\n        self._capacity = LIVE_FILTER_STREAM_VIEW_CAPACITY\n        self._frames.clear()\n        self.endResetModel()\n\n    def apply_background_result(\n        self,\n        accepted_frames: tuple[CanFrame, ...],\n        evaluated_through_sequence: int,\n    ) -> None:\n",
