name: Comparison UDS Latency Stage 2C2 Validation

on:
  push:
  pull_request:

jobs:
  comparison-uds-latency-stage2c2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1
      - name: Install GUI and test tooling
        run: python -m pip install -q -e ".[gui,dev]"
      - name: Compile Stage 2C2 sources
        run: >-
          python -m compileall -q
          app/comparison_uds_latency.py
          gui/comparison_uds_latency_view.py
          gui/comparison_visualization_stage2c2.py
          gui/comparison_sets_analysis_view.py
          tests/test_comparison_uds_latency.py
          tests_gui/comparison_uds_latency_smoke.py
      - name: Verify UDS latency core and artifact
        run: python -m pytest tests/test_comparison_uds_latency.py -q
      - name: Verify UDS latency GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests_gui/comparison_uds_latency_smoke.py
