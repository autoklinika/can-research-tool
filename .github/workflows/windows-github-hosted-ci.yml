name: Windows GitHub-Hosted CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-github-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"
          python -c "import PySide6, pytest, cantools; print('Dependencies: OK')"

      - name: Full validation suite
        id: full_validation
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @(
            @{ Name = "Compile Python sources"; Command = "python -m compileall -q app kvaser gui" },
            @{ Name = "Unit tests"; Command = "python -m pytest -q" },
            @{ Name = "Application startup smoke"; Command = "python .\tests_gui\application_startup_smoke.py" },
            @{ Name = "Engineering shell smoke"; Command = "python .\tests_gui\engineering_shell_smoke.py" },
            @{ Name = "Static filter editor smoke"; Command = "python .\tests_gui\static_filter_editor_smoke.py" },
            @{ Name = "Filter manager window smoke"; Command = "python .\tests_gui\filter_manager_window_smoke.py" },
            @{ Name = "Static filter Live and stored smoke"; Command = "python .\tests_gui\static_filter_live_stored_smoke.py" },
            @{ Name = "Live filter worker smoke"; Command = "python .\tests_gui\live_filter_worker_smoke.py" },
            @{ Name = "Live buffer performance smoke"; Command = "python .\tests_gui\live_buffer_performance_smoke.py" },
            @{ Name = "DBC activation smoke"; Command = "python .\tests_gui\dbc_activation_smoke.py" },
            @{ Name = "Session tree smoke"; Command = "python .\tests_gui\session_management_smoke.py tree" },
            @{ Name = "Stored logical workspace smoke"; Command = "python .\tests_gui\stored_logical_workspace_smoke.py" },
            @{ Name = "Logical message details smoke"; Command = "python .\tests_gui\logical_message_details_smoke.py" },
            @{ Name = "UDS decoded data smoke"; Command = "python .\tests_gui\uds_data_display_smoke.py" },
            @{ Name = "Live session actions smoke"; Command = "python .\tests_gui\session_management_smoke.py live" },
            @{ Name = "Imported session actions smoke"; Command = "python .\tests_gui\session_management_smoke.py imported" },
            @{ Name = "Table hover smoke"; Command = "python .\tests_gui\table_hover_smoke.py" },
            @{ Name = "Protocol filter GUI smoke"; Command = "python .\tests_gui\protocol_filter_gui_smoke.py" }
          )

          $report = Join-Path $env:RUNNER_TEMP "full-validation-results.txt"
          "Windows GitHub-Hosted full validation" | Set-Content $report
          "Commit: $env:GITHUB_SHA" | Add-Content $report
          "Runner: $env:RUNNER_NAME" | Add-Content $report
          "" | Add-Content $report

          $results = @()
          $failed = 0

          foreach ($test in $tests) {
            Write-Host ""
            Write-Host "========== $($test.Name) =========="
            "========== $($test.Name) ==========" | Add-Content $report
            Invoke-Expression "$($test.Command) 2>&1" | Tee-Object -FilePath $report -Append
            $exitCode = $LASTEXITCODE
            $status = if ($exitCode -eq 0) { "PASS" } else { "FAIL" }
            if ($exitCode -ne 0) { $failed++ }
            $results += [PSCustomObject]@{
              Test = $test.Name
              Status = $status
              ExitCode = $exitCode
            }
            "RESULT: $status (exit $exitCode)" | Add-Content $report
            "" | Add-Content $report
          }

          Write-Host ""
          Write-Host "========== FULL VALIDATION SUMMARY =========="
          $summary = $results | Format-Table -AutoSize | Out-String
          Write-Host $summary
          "========== FULL VALIDATION SUMMARY ==========" | Add-Content $report
          $summary | Add-Content $report

          "### Windows full validation" | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "| Test | Status | Exit code |" | Add-Content $env:GITHUB_STEP_SUMMARY
          "|---|---:|---:|" | Add-Content $env:GITHUB_STEP_SUMMARY
          foreach ($result in $results) {
            "| $($result.Test) | $($result.Status) | $($result.ExitCode) |" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

          "VALIDATION_REPORT=$report" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FAILED_COUNT=$failed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($failed -gt 0) {
            exit 1
          }

      - name: Upload full validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-validation-report
          path: ${{ env.VALIDATION_REPORT }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation result
        if: always()
        shell: pwsh
        run: |
          if ($env:FAILED_COUNT -and [int]$env:FAILED_COUNT -gt 0) {
            throw "$env:FAILED_COUNT validation test(s) failed."
          }
