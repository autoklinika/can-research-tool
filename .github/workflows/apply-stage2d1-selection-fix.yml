name: Apply focused Stage 2D1 selection fix

on:
  push:
    branches:
      - agent/comparison-visualization-stage2d1-uds-transaction-explorer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/comparison-visualization-stage2d1-uds-transaction-explorer
          fetch-depth: 0
      - name: Clear stale transaction selection before rebuilding table
        shell: python
        run: |
          from pathlib import Path

          path = Path("gui/comparison_uds_transaction_explorer_view.py")
          text = path.read_text(encoding="utf-8")
          old_populate = '''        self._transaction_rows = list(
              result.visible_transactions
          )
          self._selected_record = None
          self.transaction_table.setRowCount(
          '''
          new_populate = '''        self._transaction_rows = list(
              result.visible_transactions
          )
          self._selected_record = None
          self.transaction_table.clearSelection()
          self.transaction_table.setRowCount(
          '''
          old_clear = '''        self.comparison_table.setRowCount(0)
          self.transaction_table.setRowCount(0)
          self.details.clear()
          '''
          new_clear = '''        self.comparison_table.setRowCount(0)
          self.transaction_table.clearSelection()
          self.transaction_table.setRowCount(0)
          self.details.clear()
          '''
          if old_populate not in text or old_clear not in text:
              if new_populate in text and new_clear in text:
                  raise SystemExit(0)
              raise SystemExit("expected Stage 2D1 selection blocks were not found")
          text = text.replace(old_populate, new_populate, 1)
          text = text.replace(old_clear, new_clear, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui/comparison_uds_transaction_explorer_view.py
          git diff --cached --quiet && exit 0
          git commit -m "Clear stale UDS explorer selection after filtering"
          git push origin HEAD:agent/comparison-visualization-stage2d1-uds-transaction-explorer
