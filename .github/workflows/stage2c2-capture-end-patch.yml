name: Apply focused Stage 2C2 timeout fix

on:
  push:
    branches:
      - agent/comparison-visualization-stage2c2-uds-latency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/comparison-visualization-stage2c2-uds-latency
          fetch-depth: 0
      - name: Patch capture-end timestamp lookup
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/comparison_uds_latency.py")
          text = path.read_text(encoding="utf-8")
          old = '''    reader = SessionPagedReader(project.absolute_path(record.relative_path))
              if consumed < reader.frame_count:
                  consumed = reader.frame_count
              if reader.frame_count and last_capture_timestamp_ns == 0:
                  for frame in reader.iter_frames():
                      last_capture_timestamp_ns = int(frame.timestamp_ns)
          '''
          new = '''    reader = SessionPagedReader(project.absolute_path(record.relative_path))
              consumed = reader.frame_count
              if reader.frame_count:
                  final_page = reader.read_page(reader.frame_count - 1, 1)
                  if final_page:
                      last_capture_timestamp_ns = int(final_page[0].timestamp_ns)
          '''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("expected Stage 2C2 timeout block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/comparison_uds_latency.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix UDS timeout classification at capture end"
          git push origin HEAD:agent/comparison-visualization-stage2c2-uds-latency
