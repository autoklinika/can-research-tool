name: Apply Hover Cell Fix

on:
  push:
    branches:
      - agent/live-buffer-performance-fix

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-buffer-performance-fix
          fetch-depth: 0
      - name: Apply hover integration patch
        shell: bash
        run: |
          if [[ ! -f .hover-cell-fix.patch ]]; then
            echo 'Patch already applied.'
            exit 0
          fi
          git apply --check .hover-cell-fix.patch
          git apply --index .hover-cell-fix.patch
          git rm .hover-cell-fix.patch
          git config user.name 'CRT hover automation'
          git config user.email 'hover-automation@users.noreply.github.com'
          git commit -m 'Improve table cell hover responsiveness'
          git push origin HEAD:agent/live-buffer-performance-fix
