name: Help Center Validation

on:
  push:
  pull_request:

jobs:
  help-center:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GUI and test tooling
        run: python -m pip install -q -e ".[gui,dev]"
      - name: Compile Help Center sources
        run: python -m compileall -q app/help_catalog.py gui/help_center_view.py gui/help_center_shell.py gui/application_container.py tests/test_help_catalog.py tests_gui/help_center_smoke.py
      - name: Verify Help catalog and search
        run: python -m pytest tests/test_help_catalog.py -q --junitxml=help-catalog-junit.xml
      - name: Upload Help catalog diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: help-catalog-windows
          path: help-catalog-junit.xml
          retention-days: 3
      - name: Verify production Help Center GUI
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python tests_gui/help_center_smoke.py *> help-center-gui.log
          $result = $LASTEXITCODE
          Get-Content help-center-gui.log
          exit $result
      - name: Upload Help Center GUI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: help-center-gui-windows
          path: help-center-gui.log
          retention-days: 3
