name: Apply Hover Rename

on:
  push:
    branches:
      - agent/live-buffer-performance-fix

permissions:
  contents: write

jobs:
  apply-rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-buffer-performance-fix
          fetch-depth: 0
      - name: Apply hover rename patch
        shell: bash
        run: |
          if [[ ! -f .hover-rename.patch ]]; then
            echo 'Rename already applied.'
            exit 0
          fi
          git apply --check .hover-rename.patch
          git apply --index .hover-rename.patch
          git rm .hover-rename.patch
          git config user.name 'CRT hover automation'
          git config user.email 'hover-automation@users.noreply.github.com'
          git commit -m 'Rename hover configurator'
          git push origin HEAD:agent/live-buffer-performance-fix
