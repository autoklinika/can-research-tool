name: Export Live Performance Source

on:
  push:
    branches:
      - agent/live-buffer-performance-fix
  pull_request:
    branches:
      - agent/filter-gui-stage5e

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: live-perf-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
