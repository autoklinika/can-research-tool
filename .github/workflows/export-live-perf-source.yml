name: Apply Live Performance Fix

on:
  push:
    branches:
      - agent/live-buffer-performance-fix
  pull_request:
    branches:
      - agent/filter-gui-stage5e

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-buffer-performance-fix
          fetch-depth: 0
      - name: Apply prepared performance patch
        shell: bash
        run: |
          if [[ ! -f .live-perf-ready ]]; then
            echo 'Patch not ready yet.'
            exit 0
          fi
          cat .live-perf-part-* | base64 --decode | gzip --decompress > /tmp/live-perf.patch
          git apply --check /tmp/live-perf.patch
          git apply --index /tmp/live-perf.patch
          rm -f .live-perf-part-* .live-perf-ready
          git add -A
          git config user.name 'CRT Live performance automation'
          git config user.email 'live-performance@users.noreply.github.com'
          git commit -m 'Fix progressive Live buffer slowdown'
          git push origin HEAD:agent/live-buffer-performance-fix
