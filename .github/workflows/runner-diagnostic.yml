name: Runner Diagnostic

on:
  pull_request:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: self-hosted
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Inspect runner account and CRT Python
        run: |
          Write-Host "Account: $(whoami)"
          Write-Host "Runner root: $env:RUNNER_WORKSPACE"
          $python = 'C:\CAN\can-research-tool\.venv\Scripts\python.exe'
          Write-Host "Python path: $python"
          Write-Host "Python exists: $(Test-Path $python)"
          Write-Host "C:\CAN exists: $(Test-Path 'C:\CAN')"
          Write-Host "Project exists: $(Test-Path 'C:\CAN\can-research-tool')"
          if (Test-Path $python) {
              & $python --version
              & $python -c "import sys; print(sys.executable)"
              & $python -c "import PySide6; print('PySide6 OK')"
              & $python -c "import pytest; print('pytest OK')"
              & $python -c "import canlib; print('canlib OK')"
              & $python -c "import cantools; print('cantools OK')"
          }
