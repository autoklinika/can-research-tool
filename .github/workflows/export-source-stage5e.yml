name: Apply Stage 5E Patch

on:
  push:
    branches:
      - agent/filter-gui-stage5e
  pull_request:
    branches:
      - agent/filter-uds-stage5d

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/filter-gui-stage5e
          fetch-depth: 0
      - name: Assemble prepared patch
        shell: bash
        run: |
          cat .stage5e-part-* | base64 --decode | gzip --decompress > /tmp/stage5e.patch
          git apply --check \
            --exclude=.github/workflows/export-source-stage5e.yml \
            --exclude=.github/workflows/gui-regression.yml \
            /tmp/stage5e.patch
      - name: Apply prepared patch
        shell: bash
        run: |
          git apply --index \
            --exclude=.github/workflows/export-source-stage5e.yml \
            --exclude=.github/workflows/gui-regression.yml \
            /tmp/stage5e.patch
      - name: Commit and push Stage 5E
        shell: bash
        run: |
          git config user.name 'CRT Stage 5E automation'
          git config user.email 'stage5e@users.noreply.github.com'
          git commit -m 'Integrate protocol filters into GUI'
          git push origin HEAD:agent/filter-gui-stage5e
