name: Export Stage 5E Source

on:
  push:
    branches:
      - agent/filter-gui-stage5e

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: stage5e-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
