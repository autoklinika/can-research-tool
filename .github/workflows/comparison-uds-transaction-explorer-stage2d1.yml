name: Comparison UDS Transaction Explorer Stage 2D1 Validation

on:
  push:
  pull_request:

jobs:
  comparison-uds-transaction-explorer-stage2d1:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GUI and test tooling
        run: python -m pip install -q -e ".[gui,dev]"
      - name: Compile Stage 2D1 sources
        run: python -m compileall -q app/comparison_uds_transaction_explorer.py app/comparison_uds_explorer_source.py gui/comparison_uds_transaction_explorer_view.py gui/comparison_uds_transaction_explorer_source_view.py gui/comparison_visualization_stage2d1.py gui/comparison_sets_analysis_view.py tests/test_comparison_uds_transaction_explorer.py tests/test_comparison_uds_explorer_source.py tests_gui/comparison_uds_transaction_explorer_smoke.py tests_gui/comparison_uds_explorer_source_smoke.py
      - name: Verify UDS transaction explorer core and artifact selection
        run: python -m pytest tests/test_comparison_uds_transaction_explorer.py tests/test_comparison_uds_explorer_source.py -q
      - name: Verify UDS transaction explorer GUI
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python tests_gui/comparison_uds_transaction_explorer_smoke.py *> stage2d1-gui.log
          $first = $LASTEXITCODE
          python tests_gui/comparison_uds_explorer_source_smoke.py *>> stage2d1-gui.log
          $second = $LASTEXITCODE
          Get-Content stage2d1-gui.log
          if ($first -ne 0) { exit $first }
          exit $second
      - name: Upload Stage 2D1 GUI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage2d1-gui-windows
          path: stage2d1-gui.log
          retention-days: 3
