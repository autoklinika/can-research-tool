[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "can-research-tool"
version = "0.1.0"
description = "Passive CAN reverse-engineering toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kvaser = ["canlib>=1.33,<2"]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app", "kvaser"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
