[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "can-research-tool"
version = "0.1.0"
description = "Passive CAN reverse-engineering toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cantools>=39,<42"]

[project.optional-dependencies]
kvaser = ["canlib>=1.33,<2"]
gui = ["PySide6>=6.7,<7"]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
crt-capture = "app.capture_cli:main"
crt-gui = "gui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "kvaser", "gui", "infrastructure"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
